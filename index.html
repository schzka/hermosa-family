<!DOCTYPE html>

<head>

<title>Hermosa — The Family</title>
<meta name="description" content="Hermosa — a FiveM roleplay family. Hierarchy, branches, bloodline lineage, and full roster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // GitHub Pages SPA route restoration script
  (function(l) {
    if (l.search[1] === 'p') {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&') 
      }).filter(function(s) {
        return s.slice(0, 2) === 'p='
      })[0];
      if (decoded) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded.slice(2) + l.hash
        );
      }
    }
  }(window.location))
</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
